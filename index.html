<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="血压日记">
<title>血压日记</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>血压日记</h1>
  </header>

  <main id="views">

    <!-- ========== 填写页 ========== -->
    <section class="view active" id="view-entry">
      <div class="hero">
        <div class="hero-row">
          <div>
            <div class="hero-date" id="entryDate">--</div>
            <div class="hero-sub" id="entryWeekday">--</div>
          </div>
          <div class="hero-badge" id="entryProgress">0 / 2</div>
        </div>
        <div class="hero-hint" id="entryHint">每天早晚各测两次，取平均值作为最终数据</div>
      </div>
      <div id="entryCards"></div>
    </section>

    <!-- ========== 记录页 ========== -->
    <section class="view" id="view-records">
      <div class="seg" id="rangeSeg">
        <button class="seg-btn active" data-range="7">近 7 天</button>
        <button class="seg-btn" data-range="30">近 30 天</button>
        <button class="seg-btn" data-range="0">全部</button>
      </div>

      <div class="stats" id="recordStats"></div>

      <div class="card">
        <div class="card-head">
          <h2>趋势</h2>
          <div class="legend">
            <span class="dot sys"></span>收缩压
            <span class="dot dia"></span>舒张压
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="trendChart"></canvas>
          <div class="chart-empty" id="chartEmpty">暂无数据</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>明细</h2>
          <span class="muted" id="recordCount"></span>
        </div>
        <div id="recordList"></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>数据管理</h2></div>
        <p class="muted small">数据只保存在本机浏览器中，换设备或清理缓存前请先导出备份。</p>
        <div class="btn-row">
          <button class="btn ghost" id="btnExport">导出备份</button>
          <button class="btn ghost" id="btnImport">导入备份</button>
          <button class="btn ghost danger" id="btnClear">清空数据</button>
        </div>
        <input type="file" id="fileInput" accept="application/json" hidden>
      </div>
    </section>

    <!-- ========== AI 助手页 ========== -->
    <section class="view" id="view-ai">
      <div class="card" id="apiCard">
        <div class="card-head">
          <h2>AI 健康助手</h2>
          <button class="link-btn" id="btnToggleApi">设置</button>
        </div>
        <p class="muted small" id="apiStatus">尚未配置 API</p>
        <div class="api-form" id="apiForm" hidden>
          <label class="field">
            <span>服务商</span>
            <select id="apiProvider">
              <option value="deepseek">DeepSeek（默认）</option>
              <option value="kimi">Kimi 月之暗面</option>
              <option value="openai">ChatGPT（OpenAI）</option>
              <option value="qwen">通义千问</option>
              <option value="zhipu">智谱 GLM</option>
              <option value="custom">自定义接口</option>
            </select>
          </label>
          <label class="field">
            <span>接口地址</span>
            <input type="text" id="apiBase" placeholder="https://api.deepseek.com/v1">
          </label>
          <label class="field">
            <span>API Key</span>
            <input type="password" id="apiKey" placeholder="sk-...">
          </label>
          <label class="field">
            <span>模型</span>
            <input type="text" id="apiModel" placeholder="deepseek-chat">
          </label>
          <p class="muted tiny">选择服务商会自动填入接口地址和常用模型，也可手动修改。OpenAI、Kimi 等可能限制浏览器直连，若提示网络或跨域错误，建议改用 DeepSeek 或填写自己的代理地址。</p>
          <div class="grid2">
            <label class="field">
              <span>年龄（可选）</span>
              <input type="number" id="profileAge" placeholder="如 65">
            </label>
            <label class="field">
              <span>性别</span>
              <select id="profileGender">
                <option value="">未填写</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </label>
          </div>
          <button class="btn primary" id="btnSaveApi">保存配置</button>
          <p class="muted tiny">密钥仅保存在本机浏览器，不会上传到任何服务器，仅用于直连你填写的接口。</p>
        </div>
      </div>

      <div class="quick-row">
        <button class="chip" data-ask="请根据我最近一周的血压数据做一次整体评估，指出风险点和需要关注的地方。">周报评估</button>
        <button class="chip" data-ask="我的血压波动大吗？需要调整用药或就医吗？">波动分析</button>
        <button class="chip" data-ask="请给我一些适合我的饮食和运动建议。">生活建议</button>
      </div>

      <div class="chat" id="chatBox"></div>

      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="问问 AI，例如：早上血压偏高怎么办？">
        <button class="btn primary" id="btnSend">发送</button>
      </div>
      <p class="disclaimer">AI 建议仅供参考，不能替代医生诊断。如有不适请及时就医。</p>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="entry">
      <span class="tab-icon">✚</span><span>填写</span>
    </button>
    <button class="tab" data-view="records">
      <span class="tab-icon">📊</span><span>记录</span>
    </button>
    <button class="tab" data-view="ai">
      <span class="tab-icon">🤖</span><span>AI 助手</span>
    </button>
  </nav>

</div>

<div class="toast" id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/ai.js"></script>
</body>
</html>
